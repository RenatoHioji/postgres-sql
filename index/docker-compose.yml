services:
  postgres:
    image: postgres:18.6
    container_name: postgres18
    restart: unless-stopped
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: index_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d index_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    configs:
      - source: init_sql
        target: /docker-entrypoint-initdb.d/init.sql

configs:
  init_sql:
    file: ./init.sql

volumes:
  pgdata: